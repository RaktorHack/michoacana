            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px 0;
            }

            .catalogo img {
                margin-bottom: 10px;
                border-radius: 0;
            }
        }
    </style>
</head>
